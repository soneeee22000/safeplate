[project]
name = "safeplate"
version = "1.0.0"
description = "Allergen agent: Gemma 4 hears and speaks, deterministic tables decide."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["archive", "web", "stitch_ref"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
